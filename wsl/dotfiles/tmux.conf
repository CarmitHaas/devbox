# ~/.tmux.conf: prefix C-a, mouse, vi copy mode, sane splits, clipboard to Windows.

# prefix: Ctrl+a (Ctrl+b is too far)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# behaviour
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#S:#W"
# closing the last window of a session jumps to another session instead of leaving tmux
set -g detach-on-destroy off
# a window where a long job finished gets highlighted in the status bar, no popup
setw -g monitor-activity on
set -g visual-activity off

# splits open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# (no Alt+Arrow bindings: Windows Terminal uses those for its own panes)

# vi copy mode; y copies to the Windows clipboard through clip.exe (falls back to tmux buffer)
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi r send -X rectangle-toggle
if-shell "command -v clip.exe" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'clip.exe'" \
  "bind -T copy-mode-vi y send -X copy-selection-and-cancel"
bind p paste-buffer

# reload
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# status bar: session left, windows centered, time right
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bold,fg=colour81] #S #[default]| "
set -g status-right "#[fg=colour245]%Y-%m-%d #[bold,fg=colour250]%H:%M "
# window name: the current directory when the window is just a shell, else the command
setw -g window-status-format " #I:#{?#{m:*sh,#W},#{b:pane_current_path},#W} "
setw -g window-status-current-format "#[bold,bg=colour239,fg=colour255] #I:#{?#{m:*sh,#W},#{b:pane_current_path},#W} "
setw -g window-status-activity-style "fg=colour214"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour81"
set -g message-style "bg=colour81,fg=colour236"
